<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crochet Studio - Quản lý Chart Móc Len</title>
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --surface-soft: #f3ede4;
      --text: #362f2a;
      --text-muted: #7a6f66;
      --accent: #c96f4d;
      --accent-hover: #b35c3b;
      --border: #e6ddd2;
      --success: #4a7c59;
      --warning: #c88a2e;
      --danger: #c04a4a;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(54, 47, 42, 0.06);
      --font-sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .brand span { color: var(--accent); }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Buttons */
    button, .btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover { background: var(--surface-soft); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { color: var(--danger); border-color: #ebc8c8; }
    .btn-danger:hover { background: #fdf2f2; }

    /* Main Container */
    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px 60px;
    }

    /* Toolbar */
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 720px) {
      .toolbar { grid-template-columns: 1fr; }
    }

    input[type="text"], select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Grid Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(54, 47, 42, 0.1);
    }

    .card-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: var(--surface-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface-soft);
      color: var(--text-muted);
    }

    .status-todo { background: #ece8e1; color: #6b625b; }
    .status-doing { background: #fcf0dc; color: var(--warning); }
    .status-done { background: #e3f1e8; color: var(--success); }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .card-specs {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(35, 29, 25, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 820px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--bg);
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    textarea.chart-input {
      font-family: var(--font-mono);
      min-height: 220px;
      line-height: 1.7;
    }

    /* Viewer Mode */
    .viewer-top {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .viewer-top { grid-template-columns: 1fr; }
    }

    .viewer-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }

    .spec-list {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
      margin-top: 10px;
    }

    /* Row Counter */
    .counter-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-soft);
      padding: 8px 14px;
      border-radius: 10px;
      margin-top: 14px;
    }

    .counter-num {
      font-size: 1.3rem;
      font-weight: 700;
      min-width: 36px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    /* Standardized Chart Lines */
    .chart-viewer {
      background: #fcfaf7;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-top: 12px;
    }

    .chart-section-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent);
      margin: 16px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .chart-section-title:first-child { margin-top: 0; }

    .chart-line {
      font-family: var(--font-mono);
      font-size: 0.96rem;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: background 0.12s;
    }

    .chart-line:hover { background: var(--surface-soft); }

    .chart-line.plain-line {
      cursor: default;
    }

    .chart-line.plain-line:hover {
      background: transparent;
    }

    .chart-line.checked {
      color: var(--text-muted);
      text-decoration: line-through;
      background: #eef5f0;
    }

    .chart-check {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      margin-top: 3px;
      background: #fff;
    }

    .chart-line.checked .chart-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .attachments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .note-box {
      background: #fff9eb;
      border-left: 4px solid var(--warning);
      padding: 12px 16px;
      border-radius: 6px;
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 0.92rem;
    }
    #viewModal {
  gap: 20px;
}
.floating-cover {
  display: none;
  width: 300px;
  background: var(--surface);
  padding: 12px;
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
  flex-shrink: 0;
}
.floating-cover img {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  border-radius: 8px;
  display: block;
}
@media (max-width: 1050px) {
  .floating-cover { display: none !important; }
}
details.chart-section {
  margin-top: 14px;
}
details.chart-section:first-child {
  margin-top: 0;
}
summary.chart-section-title {
  cursor: pointer;
  user-select: none;
  margin: 0 0 8px 0;
}
summary.chart-section-title:hover {
  opacity: 0.75;
}
.chart-main-title {
  font-size: 1.45rem;
  font-weight: 800;
  color: #3d6b59; /* Màu xanh rêu đậm - bạn có thể di chuột vào ô màu trong VS Code để đổi màu khác */
  margin: 4px 0 18px 0;
  padding-bottom: 10px;
  border-bottom: 2px solid #3d6b59;
}
.chart-subtitle {
  font-family: var(--font-sans);
  font-size: 1.03rem;
  font-weight: 700;
  color: var(--text);
  margin: 12px 0 4px 0;
  padding: 4px 10px;
}
summary.chart-section-title + .chart-subtitle {
  margin-top: 4px;
}
body.public-mode .header-actions,
body.public-mode #viewModal .modal-header button:not(:last-child),
body.public-mode .btn-danger {
  display: none !important;
}
.chart-link-line {
  padding: 6px 10px;
  margin: 4px 0;
  word-break: break-all;
}
.chart-link-line a {
  color: #b85c38;
  text-decoration: underline;
  font-weight: 500;
}
.chart-link-line a:hover {
  opacity: 0.75;
}

<body>

<header>
  <div class="brand">🧶 Chart sưu tầm<span>Zet Zet</span></div>
  <div class="header-actions">
    <button onclick="exportData()">⬇ Sao lưu (.json)</button>
    <button onclick="document.getElementById('importFile').click()">⬆ Khôi phục</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    <button class="btn-primary" onclick="openFormModal()">+ Thêm Chart Mới</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Tìm theo tên mẫu, loại len, ghi chú..." oninput="renderGrid()" />
    <select id="filterCategory" onchange="renderGrid()">
      <option value="">Tất cả phân loại</option>
      <option value="Thú bông">Thú bông (Amigurumi)</option>
      <option value="Hoa & Cây">Hoa & Chậu cây</option>
      <option value="Phụ kiện">Phụ kiện / Túi</option>
      <option value="Trang trí">Trang trí / Ornament</option>
      <option value="Khác">Khác</option>
    </select>
    <select id="filterStatus" onchange="renderGrid()">
      <option value="">Tất cả trạng thái</option>
      <option value="todo">Chưa làm</option>
      <option value="doing">Đang móc</option>
      <option value="done">Hoàn thành</option>
    </select>
  </div>

  <div id="chartGrid" class="grid"></div>
</main>

<!-- Modal Thêm / Sửa Chart -->
<div id="formModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="formTitle">Thêm Chart Mới</h3>
      <button onclick="closeModal('formModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="chartId" />
      <div class="form-group">
        <label>Tên mẫu móc *</label>
        <input type="text" id="fTitle" placeholder="VD: Chậu hoa mặt cười, Bánh mì mèo..." />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Phân loại</label>
          <select id="fCategory">
            <option value="Thú bông">Thú bông (Amigurumi)</option>
            <option value="Hoa & Cây">Hoa & Chậu cây</option>
            <option value="Phụ kiện">Phụ kiện / Túi</option>
            <option value="Trang trí">Trang trí / Ornament</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
        <div class="form-group">
          <label>Trạng thái</label>
          <select id="fStatus">
            <option value="todo">Chưa làm</option>
            <option value="doing">Đang móc</option>
            <option value="done">Hoàn thành</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Kim móc</label>
          <input type="text" id="fHook" placeholder="VD: 2.5mm, 3.0mm" />
        </div>
        <div class="form-group">
          <label>Loại len & Màu sắc</label>
          <input type="text" id="fYarn" placeholder="VD: Milk Cotton 50g - Kem, Vàng, Xanh lá" />
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Ảnh thành phẩm (Cover)</label>
          <input type="file" id="fCover" accept="image/*" />
          <div class="hint" id="coverHint">Chọn ảnh hiển thị ngoài thẻ (không bắt buộc).</div>
        </div>
        <div class="form-group">
          <label>Đính kèm file gốc (Ảnh chart / PDF)</label>
          <input type="file" id="fRefs" accept="image/*,.pdf" multiple onchange="autoConvertImages(this.files)" />
          <div class="hint" id="refsHint">Có thể chọn nhiều file để đối chiếu khi cần.</div>
          <div class="hint" id="ocrStatus" style="color:var(--accent); font-weight:600;"></div>
          <div id="existingRefsList" class="attachments-list"></div>
        </div>
      </div>

      <div class="form-group">
        <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:0;">
          <input type="checkbox" id="fHideCheckboxes" style="width:auto; cursor:pointer;" />
          <span>Ẩn ô tích ở đầu dòng (dùng cho bài kí hiệu, ghi chú, tips...)</span>
        </label>
      </div>

      <div class="form-group">
        <label>Nội dung Chart (Đồng bộ font chữ)</label>
        <textarea id="fPattern" class="chart-input" placeholder="Mẹo định dạng:
- Bắt đầu bằng # : Tiêu đề lớn
- Kết thúc bằng : : Phần xổ xuống (thu gọn/mở rộng)
- Bắt đầu bằng ## : Tiêu đề phụ (chữ to và đậm hơn dòng thường, không có ô tích)

Ví dụ:
# Chậu hoa mặt cười
PHẦN CHẬU CÂY:
## Phần đáy chậu
H1: MR 6X (6)
H2: 6V (12)
H3: (X, V) x 6 (18)

PHẦN HOA (x2):
H1: MR 5X (5)
H2: (ch2, 2F, ch2, slst) x 5"></textarea>
      </div>

      <div class="form-group">
        <label>Ghi chú cá nhân (Chỉnh sửa, lưu ý mũi móc...)</label>
        <textarea id="fNotes" rows="3" placeholder="VD: Đổi sang kim 2.0mm ở phần tay cho cứng cáp hơn..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('formModal')">Hủy</button>
      <button class="btn-primary" onclick="saveChart()">Lưu Chart</button>
    </div>
  </div>
</div>

<!-- Modal Xem & Móc Chart -->
<div id="viewModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="vTitle">Chi tiết Chart</h3>
      <div style="display:flex; gap:8px;">
        <button onclick="editCurrentChart()">✎ Sửa</button>
        <button class="btn-danger" onclick="deleteCurrentChart()">🗑 Xóa</button>
        <button onclick="closeModal('viewModal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="viewContent"></div>
  </div>
  <div id="floatingCover" class="floating-cover"></div>
</div>

<script>
  const DB_NAME = 'CrochetStudioDB';
  const STORE_NAME = 'charts';
  let db;
  let allCharts = [];
  let currentChartId = null;
  let editingRefFiles = [];

  const STATUS_MAP = {
    todo: { label: 'Chưa làm', cls: 'status-todo' },
    doing: { label: 'Đang móc', cls: 'status-doing' },
    done: { label: 'Hoàn thành', cls: 'status-done' }
  };

  // Khởi tạo IndexedDB
  function initDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_NAME)) {
          d.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => {
        db = e.target.result;
        resolve();
      };
      req.onerror = (e) => reject(e);
    });
  }

  function dbGetAll() {
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).getAll();
      req.onsuccess = () => resolve(req.result.sort((a, b) => b.updatedAt - a.updatedAt));
    });
  }

  function dbPut(item) {
    if (!db) return Promise.resolve();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(item);
      tx.oncomplete = () => resolve();
    });
  }

  function dbDelete(id) {
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => resolve();
    });
  }

  function escapeHtml(str = '') {
    return str.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
  }
  function linkify(text = '') {
  return escapeHtml(text).replace(
    /(https?:\/\/[^\s]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:underline; word-break:break-all;">$1</a>'
  );
  }

  function fileToDataURL(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function openDataUrlInNewTab(dataUrl) {
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    const blob = new Blob([u8arr], { type: mime });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }

  async function loadAndRender() {
    allCharts = await dbGetAll();
    renderGrid();
  }

  function renderGrid() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const cat = document.getElementById('filterCategory').value;
    const st = document.getElementById('filterStatus').value;

    const filtered = allCharts.filter(c => {
      const matchText = !q ||
        c.title.toLowerCase().includes(q) ||
        (c.yarn || '').toLowerCase().includes(q) ||
        (c.notes || '').toLowerCase().includes(q);
      const matchCat = !cat || c.category === cat;
      const matchSt = !st || c.status === st;
      return matchText && matchCat && matchSt;
    });

    const grid = document.getElementById('chartGrid');
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        Chưa có chart nào phù hợp. Bấm <strong>+ Thêm Chart Mới</strong> ở góc trên để bắt đầu!
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(c => {
      const stInfo = STATUS_MAP[c.status] || STATUS_MAP.todo;
      const imgHtml = c.coverImage
        ? `<img class="card-img" loading="lazy" src="${c.coverImage}" alt="${escapeHtml(c.title)}" />`
        : `<div class="card-img">🧶 Chưa có ảnh</div>`;

      return `
        <div class="card" onclick="openViewModal('${c.id}')">
          ${imgHtml}
          <div class="card-body">
            <div class="card-meta">
              <span class="badge">${escapeHtml(c.category)}</span>
              <span class="badge ${stInfo.cls}">${stInfo.label}</span>
            </div>
            <div class="card-title">${escapeHtml(c.title)}</div>
            <div class="card-specs">
              ${c.hook ? `🪝 Kim: ${escapeHtml(c.hook)}<br>` : ''}
              ${c.yarn ? `🧵 Len: ${escapeHtml(c.yarn)}` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Modal Form
  function openFormModal(chart = null) {
    document.getElementById('formTitle').textContent = chart ? 'Chỉnh sửa Chart' : 'Thêm Chart Mới';
    document.getElementById('chartId').value = chart ? chart.id : '';
    document.getElementById('fTitle').value = chart ? chart.title : '';
    document.getElementById('fCategory').value = chart ? chart.category : 'Thú bông';
    document.getElementById('fStatus').value = chart ? chart.status : 'todo';
    document.getElementById('fHook').value = chart ? (chart.hook || '') : '';
    document.getElementById('fYarn').value = chart ? (chart.yarn || '') : '';
    document.getElementById('fPattern').value = chart ? (chart.patternText || '') : '';
    document.getElementById('fHideCheckboxes').checked = Boolean(chart?.hideCheckboxes);
    document.getElementById('fNotes').value = chart ? (chart.notes || '') : '';
    document.getElementById('fCover').value = '';
    document.getElementById('fRefs').value = '';
    editingRefFiles = chart?.refFiles ? [...chart.refFiles] : [];
    renderEditingRefs();
    document.getElementById('ocrStatus').textContent = '';
    document.getElementById('formModal').classList.add('open');

    document.getElementById('coverHint').textContent = chart?.coverImage
      ? 'Đang giữ ảnh cũ. Chọn ảnh mới nếu muốn thay thế.'
      : 'Chọn ảnh hiển thị ngoài thẻ (không bắt buộc).';
    document.getElementById('refsHint').textContent = chart?.refFiles?.length
      ? `Đang có ${chart.refFiles.length} file đính kèm. Chọn thêm nếu muốn bổ sung.`
      : 'Có thể chọn nhiều ảnh/PDF gốc để đối chiếu.';

    document.getElementById('formModal').classList.add('open');
  }
  function renderEditingRefs() {
  const container = document.getElementById('existingRefsList');
  if (!editingRefFiles.length) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = editingRefFiles.map((f, idx) => `
    <div style="display:inline-flex; align-items:center; gap:6px; background:var(--surface-soft); padding:4px 8px; border-radius:6px; font-size:0.82rem; border:1px solid var(--border);">
      <span>📄 ${escapeHtml(f.name)}</span>
      <button type="button" onclick="removeEditingRef(${idx})" style="padding:1px 6px; font-size:0.75rem; color:var(--danger); border:none; background:transparent;">✕</button>
    </div>
  `).join('');
}

function removeEditingRef(idx) {
  editingRefFiles.splice(idx, 1);
  renderEditingRefs();
}

  async function saveChart() {
    const title = document.getElementById('fTitle').value.trim();
    if (!title) {
      alert('Vui lòng nhập tên mẫu móc!');
      return;
    }

    const id = document.getElementById('chartId').value || String(Date.now());
    const existing = allCharts.find(c => c.id === id);

    let coverImage = existing ? existing.coverImage : '';
    const coverFile = document.getElementById('fCover').files[0];
    if (coverFile) coverImage = 'images/' + coverFile.name;

    let refFiles = [...editingRefFiles];
    const newRefs = document.getElementById('fRefs').files;
    for (const file of newRefs) {
      refFiles.push({
        name: file.name,
        type: file.type,
        dataUrl: 'images/' + file.name
      });
    }

    const record = {
      id,
      title,
      category: document.getElementById('fCategory').value,
      status: document.getElementById('fStatus').value,
      hook: document.getElementById('fHook').value.trim(),
      yarn: document.getElementById('fYarn').value.trim(),
      coverImage,
      refFiles,
      patternText: document.getElementById('fPattern').value,
      hideCheckboxes: document.getElementById('fHideCheckboxes').checked,
      notes: document.getElementById('fNotes').value.trim(),
      checkedLines: existing ? (existing.checkedLines || []) : [],
      collapsedSections: existing ? (existing.collapsedSections || []) : [],
      rowCounter: existing ? (existing.rowCounter || 0) : 0,
      updatedAt: Date.now()
    };

    await dbPut(record);
    closeModal('formModal');
    await loadAndRender();
    if (currentChartId === id) openViewModal(id);
  }

  // Modal Xem Chi Tiết
  function openViewModal(id) {
    const c = allCharts.find(item => item.id === id);
    if (!c) return;
    currentChartId = id;

    document.getElementById('vTitle').textContent = c.title;
    const stInfo = STATUS_MAP[c.status] || STATUS_MAP.todo;

    const lines = (c.patternText || '').split('\n');
    const checkedSet = new Set(c.checkedLines || []);
    const collapsedSet = new Set(c.collapsedSections || []);
    const hideChecks = Boolean(c.hideCheckboxes);

    let chartHtml = '';
    let inSection = false;
    let sectionIdx = 0;

    lines.forEach((line, idx) => {
      const trimmed = line.trim();
      if (!trimmed) {
        chartHtml += '<div style="height:8px"></div>';
        return;
      }
      if (trimmed.startsWith('##')) {
       chartHtml += `<div class="chart-subtitle">${escapeHtml(trimmed.replace(/^##+\s*/, ''))}</div>`;
     } else if (trimmed.startsWith('#')) {
       if (inSection) {
         chartHtml += '</details>';
         inSection = false;
       }
       chartHtml += `<div class="chart-main-title">${escapeHtml(trimmed.replace(/^#+\s*/, '').replace(/:$/, ''))}</div>`;
     } else if (trimmed.endsWith(':')) {
       if (inSection) chartHtml += '</details>';
       const isCollapsed = collapsedSet.has(sectionIdx);
       chartHtml += `<details class="chart-section" ${isCollapsed ? '' : 'open'} ontoggle="toggleSection(${sectionIdx}, this.open)">`;
       chartHtml += `<summary class="chart-section-title">${escapeHtml(trimmed)}</summary>`;
       inSection = true;
       sectionIdx++;
      } else if (/^https?:\/\/\S+$/i.test(trimmed)) {
        const safeUrl = escapeHtml(trimmed);
        chartHtml += `
         <div class="chart-link-line">
         🔗 <a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>
         </div>
         `;
      } else if (hideChecks) {
        chartHtml += `
          <div class="chart-line plain-line">
            <span>${escapeHtml(trimmed)}</span>
          </div>
        `;
      } else {
        const isChecked = checkedSet.has(idx);
        chartHtml += `
          <div class="chart-line ${isChecked ? 'checked' : ''}" onclick="toggleLine(${idx})">
            <span class="chart-check">${isChecked ? '✓' : ''}</span>
            <span>${escapeHtml(trimmed)}</span>
          </div>
        `;
      }
    });
    if (inSection) chartHtml += '</details>';

    const refsHtml = (c.refFiles && c.refFiles.length)
      ? `<div style="margin-top:18px;">
           <strong>📎 File gốc đính kèm (bấm để mở tab mới):</strong>
           <div class="attachments-list">
             ${c.refFiles.map((f, i) => `<button onclick="openAttachment(${i})">📄 ${escapeHtml(f.name)}</button>`).join('')}
           </div>
         </div>`
      : '';

    document.getElementById('viewContent').innerHTML = `
      <div class="viewer-top">
        ${c.coverImage
          ? `<img class="viewer-cover" src="${c.coverImage}" alt="Cover" />`
          : `<div class="viewer-cover" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted)">Chưa có ảnh</div>`}
        <div>
          <div style="display:flex; gap:8px; margin-bottom:8px;">
            <span class="badge">${escapeHtml(c.category)}</span>
            <span class="badge ${stInfo.cls}">${stInfo.label}</span>
          </div>
          <div class="spec-list">
            <div><strong>🪝 Kim móc:</strong> ${escapeHtml(c.hook || 'Chưa ghi')}</div>
            <div><strong>🧵 Len sử dụng:</strong> ${escapeHtml(c.yarn || 'Chưa ghi')}</div>
          </div>
        </div>
      </div>

      ${c.notes ? `<div class="note-box"><strong>📝 Ghi chú:</strong>\n${linkify(c.notes)}</div>` : ''}
      ${refsHtml}

      <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
        <strong>${hideChecks ? '📖 Nội dung:' : '📖 Nội dung Chart (bấm vào từng hàng để đánh dấu đã móc):'}</strong>
        ${hideChecks ? '' : '<button onclick="resetChecks()" style="font-size:0.8rem;">Bỏ đánh dấu tất cả</button>'}
      </div>
      <div class="chart-viewer">
        ${c.patternText?.trim() ? chartHtml : '<span style="color:var(--text-muted)">Chưa nhập nội dung chart.</span>'}
      </div>
    `;

    const floatBox = document.getElementById('floatingCover');
if (c.coverImage) {
  floatBox.innerHTML = `<img src="${c.coverImage}" alt="${escapeHtml(c.title)}" />`;
  floatBox.style.display = 'block';
} else {
  floatBox.style.display = 'none';
}
    document.getElementById('viewModal').classList.add('open');
  }

  async function toggleSection(secIdx, isOpen) {
  const c = allCharts.find(item => item.id === currentChartId);
  if (!c) return;
  const set = new Set(c.collapsedSections || []);
  if (isOpen) set.delete(secIdx);
  else set.add(secIdx);
  c.collapsedSections = Array.from(set);
  await dbPut(c);
}
  async function toggleLine(idx) {
    const c = allCharts.find(item => item.id === currentChartId);
    if (!c) return;
    const set = new Set(c.checkedLines || []);
    if (set.has(idx)) set.delete(idx);
    else set.add(idx);
    c.checkedLines = Array.from(set);
    await dbPut(c);
    openViewModal(currentChartId);
  }

  async function resetChecks() {
    const c = allCharts.find(item => item.id === currentChartId);
    if (!c) return;
    c.checkedLines = [];
    await dbPut(c);
    openViewModal(currentChartId);
  }

  async function updateCounter(delta, reset = false) {
    const c = allCharts.find(item => item.id === currentChartId);
    if (!c) return;
    c.rowCounter = reset ? 0 : Math.max(0, (c.rowCounter || 0) + delta);
    await dbPut(c);
    document.getElementById('rowCounterVal').textContent = c.rowCounter;
  }

  function openAttachment(index) {
    const c = allCharts.find(item => item.id === currentChartId);
    if (c && c.refFiles && c.refFiles[index]) {
      const url = c.refFiles[index].dataUrl;
      if (url.startsWith('data:')) openDataUrlInNewTab(url);
      else window.open(url, '_blank');
    }
  }

  function editCurrentChart() {
    const c = allCharts.find(item => item.id === currentChartId);
    if (c) {
      closeModal('viewModal');
      openFormModal(c);
    }
  }

  async function deleteCurrentChart() {
    if (!confirm('Bạn có chắc muốn xóa chart này không?')) return;
    await dbDelete(currentChartId);
    currentChartId = null;
    closeModal('viewModal');
    await loadAndRender();
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  // Sao lưu & Khôi phục JSON
  async function exportData() {
    const data = await dbGetAll();
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `crochet-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const items = JSON.parse(reader.result);
        if (!Array.isArray(items)) throw new Error();
        for (const item of items) {
          if (item.id && item.title) await dbPut(item);
        }
        await loadAndRender();
        alert(`Đã khôi phục thành công ${items.length} chart!`);
      } catch {
        alert('File backup không hợp lệ!');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  async function autoConvertImages(files) {
  const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) return;

  if (typeof Tesseract === 'undefined') {
    alert('Cần kết nối mạng để tải bộ nhận diện chữ (OCR) lần đầu!');
    return;
  }

  const statusEl = document.getElementById('ocrStatus');
  const patternEl = document.getElementById('fPattern');
  statusEl.textContent = `⏳ Đang khởi tạo bộ đọc tiếng Việt (0/${imageFiles.length})...`;

  try {
    const worker = await Tesseract.createWorker('vie');
    let results = [];

    for (let i = 0; i < imageFiles.length; i++) {
      statusEl.textContent = `⏳ Đang quét chữ ảnh ${i + 1}/${imageFiles.length}: ${imageFiles[i].name}...`;
      const { data: { text } } = await worker.recognize(imageFiles[i]);
      const cleaned = text.replace(/\n{3,}/g, '\n\n').trim();
      if (cleaned) results.push(cleaned);
    }

    await worker.terminate();

    if (results.length) {
      const existing = patternEl.value.trim();
      patternEl.value = (existing ? existing + '\n\n' : '') + results.join('\n\n');
    }
    statusEl.textContent = `✅ Đã chuyển đổi xong ${imageFiles.length} ảnh! Bạn hãy kiểm tra lại chữ nếu cần.`;
  } catch (err) {
    console.error(err);
    statusEl.textContent = '❌ Lỗi khi đọc ảnh. Vui lòng kiểm tra kết nối mạng.';
  }
}
// Bấm phím Esc để đóng cửa sổ đang mở
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('formModal').classList.contains('open')) {
      closeModal('formModal');
    } else if (document.getElementById('viewModal').classList.contains('open')) {
      closeModal('viewModal');
    }
  }
});
  // Khởi chạy
  if (window.location.protocol.startsWith('http')) {
  document.body.classList.add('public-mode');
  fetch('charts.json?t=' + Date.now())
    .then(res => res.json())
    .then(data => {
      allCharts = data.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      renderGrid();
    })
    .catch(() => {
      document.getElementById('chartGrid').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">Chưa có file dữ liệu <strong>charts.json</strong>.</div>';
    });
} else {
  initDB().then(loadAndRender);
}
</script>
